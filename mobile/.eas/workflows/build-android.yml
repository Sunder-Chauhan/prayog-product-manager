name: Build Prayog Android APK

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/app.json'
      - 'mobile/eas.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/assets/**'
      - 'mobile/.eas/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build internal Android app
    type: build
    params:
      platform: android
      profile: preview
